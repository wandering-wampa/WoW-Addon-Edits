name: Package addons
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: addon-release-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/package_addons.py --output dist
      - name: Publish manual-install ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded commit; a newer main build will publish the latest ZIPs."
            exit 0
          fi
          tag="addons-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --latest --title "Addon build ${GITHUB_RUN_NUMBER}" --notes "Extract each addon folder directly into your WoW Interface/AddOns folder. These ZIPs include the addon folder at the archive root."
